# Make a build debuggable, without changing code generation.
#
# Apply with: make ... SNIPPET=debug build
# Snippets are applied at CMake configure time, so add PRISTINE=y when turning
# this on or off for an existing build directory.

CONFIG_DEBUG=y

# Emit the kernel thread metadata that OpenOCD's "-rtos Zephyr" walks, so
# 'info threads' in gdb lists named Zephyr threads instead of a single bare core.
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_NAME=y

CONFIG_ASSERT=y

# NOTE: -O0 is deliberately NOT set here; see the 'debug-noopt' snippet.
