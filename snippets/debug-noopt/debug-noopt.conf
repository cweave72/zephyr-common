# Disable optimization so stepping and variable inspection are exact.
#
# Apply with: make ... SNIPPET="debug debug-noopt" build
#
# WARNING: this is not free. -O0 stops inlining and keeps every temporary live,
# which both inflates the image (rpc_demo on w55rp20_evb_pico: 242KB -> 710KB)
# and deepens every call frame at runtime. On an app with many threads and
# tuned stack sizes that is enough to overflow a stack during boot: the symptom
# is a fatal error before main, the core spinning in arch_system_halt, and no
# console enumerating at all.
#
# If that happens, raise the stacks rather than abandoning -O0 -- typically
# CONFIG_MAIN_STACK_SIZE, CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE,
# CONFIG_NET_RX_STACK_SIZE / CONFIG_NET_TX_STACK_SIZE and any app thread stacks.
# CONFIG_THREAD_ANALYZER=y (with CONFIG_THREAD_ANALYZER_AUTO=y) reports the
# high-water mark per thread and will point at the one that is short.
CONFIG_NO_OPTIMIZATIONS=y
