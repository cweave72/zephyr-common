# OpenOCD target configuration for the W55RP20-EVB-Pico's RP2040.
#
# This replaces the stock target/rp2040.cfg for two reasons:
#
# 1. Flash identification. The W55RP20 module carries a Puya P25Q16H (JEDEC
#    85 20 15, 2MB). OpenOCD's SPI device table has no Puya entries at all, so
#    autodetection fails outright with:
#        Error: Unknown flash device (ID 0x00152085)
#        Error: auto_probe failed
#    rp2040.cfg hardcodes a bank size of 0 (autodetect) and offers no way to
#    override it. Declaring an explicit size makes rp2040_flash_probe() skip the
#    JEDEC read and fall back to its generic SPI device, which drives this part
#    correctly -- it is an ordinary SPI NOR, just an unlisted one.
#
# 2. Single core. Zephyr runs core0 only; core1 stays parked in the bootrom.
#    rp2040.cfg defaults to USE_CORE=SMP, which creates both cores and configures
#    each with '-rtos hwthread' -- that conflicts with the '-rtos Zephyr' the west
#    runner adds when CONFIG_DEBUG_THREAD_INFO=y. Defining core0 alone avoids it,
#    and gives gdb a single unambiguous target.
#
# The RP2040 is a frozen part, so this file needs no upstream re-syncing.

# The device requires multidrop SWD for debug.
transport select swd

source [find target/swj-dp.tcl]

set _CHIPNAME rp2040
set _CPUTAPID 0x01002927

swj_newdap $_CHIPNAME cpu -expected-id $_CPUTAPID

dap create $_CHIPNAME.dap0 -chain-position $_CHIPNAME.cpu -dp-id $_CPUTAPID -instance-id 0

set _TARGETNAME_0 $_CHIPNAME.core0
target create $_TARGETNAME_0 cortex_m -dap $_CHIPNAME.dap0 -coreid 0

# srst does not exist on the RP2040; use SYSRESETREQ for a soft reset.
$_TARGETNAME_0 cortex_m reset_config sysresetreq

# The flash probe runs an algorithm on the target, so back the work area up.
$_TARGETNAME_0 configure -work-area-phys 0x20010000 -work-area-size 0x10000 -work-area-backup 1

# Explicit size (2MB) => the driver skips the JEDEC ID lookup. See note 1 above.
flash bank $_CHIPNAME.flash rp2040_flash 0x10000000 0x200000 0 0 $_TARGETNAME_0
